<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>無人機射擊訓練</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:none;
  font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#fff}
body{position:fixed;inset:0;width:100%}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 準心 */
#crosshair{position:fixed;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;pointer-events:none;
  filter:drop-shadow(0 0 1px #000);transition:opacity .1s}
#crosshair.off{opacity:0}

/* 瞄準鏡 */
#scopeOv{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;
  background:radial-gradient(circle at 50% 50%,transparent 0,transparent 30vmin,#000 30.4vmin)}
#scopeOv.on{opacity:1}
#scopeOv svg{position:absolute;left:50%;top:50%;width:60vmin;height:60vmin;transform:translate(-50%,-50%)}

/* 左半螢幕：轉視角 */
#lookzone{position:fixed;left:0;top:0;bottom:0;width:50%;touch-action:none}

.hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px #000,0 0 6px #000;font-weight:700}
#score{left:calc(14px + env(safe-area-inset-left));top:10px;font-size:16px;line-height:1.4}
#timer{left:50%;top:8px;transform:translateX(-50%);font-size:22px}
#heading{left:50%;top:38px;transform:translateX(-50%);font-size:13px;opacity:.9}
#ammo{left:calc(14px + env(safe-area-inset-left));bottom:14px;font-size:26px}
#toast{left:50%;top:64%;transform:translateX(-50%);font-size:18px;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}

#hit{position:fixed;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:none;opacity:0}
#hit::before,#hit::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:3px;margin:-1.5px 0 0 -17px;background:#ff4040;box-shadow:0 0 3px #000}
#hit::before{transform:rotate(45deg)}
#hit::after{transform:rotate(-45deg)}
#hit.show{animation:hm .25s ease-out}
@keyframes hm{0%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(.8)}}

#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#flash.show{animation:fl .08s ease-out}
@keyframes fl{0%{opacity:.10}100%{opacity:0}}

#arrow{position:fixed;left:0;top:0;font-size:34px;color:#ffd24a;pointer-events:none;display:none;text-shadow:0 0 4px #000}

.btn{position:fixed;border-radius:50%;border:2px solid rgba(255,255,255,.75);background:rgba(20,30,40,.45);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;touch-action:none;text-shadow:0 1px 2px #000}
.btn.down{background:rgba(255,255,255,.35);transform:scale(.94)}
#fire{right:calc(26px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:104px;height:104px;font-size:18px;background:rgba(220,50,50,.5)}
#reload{right:calc(150px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:70px;height:70px;font-size:14px}
#scopeBtn{right:calc(44px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom));width:70px;height:70px;font-size:14px}
#scopeBtn.on{background:rgba(255,200,60,.5)}
.pill{position:fixed;right:calc(12px + env(safe-area-inset-right));top:10px;padding:6px 12px;border-radius:14px;
  border:1px solid rgba(255,255,255,.6);background:rgba(20,30,40,.5);font-size:12px;font-weight:700;touch-action:none}

.overlay{position:fixed;inset:0;background:rgba(8,14,22,.9);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;padding:12px;z-index:10}
.overlay h1{margin:0;font-size:26px}
.overlay h2{margin:0;font-size:24px}
.overlay p,.overlay .res{margin:0;font-size:13px;line-height:1.6;max-width:560px;opacity:.95}
.overlay .res{font-size:16px;line-height:1.8}
.overlay button{padding:12px 38px;font-size:18px;font-weight:700;border:none;border-radius:10px;background:#ff7a1a;color:#fff}
.overlay label{font-size:13px}
.overlay input[type=range]{vertical-align:middle;width:160px}
#over{display:none}
#rotate{position:fixed;inset:0;background:#0b1118;z-index:20;display:none;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="scopeOv">
  <svg viewBox="0 0 100 100">
    <g stroke="#000" fill="none">
      <line x1="0" y1="50" x2="44" y2="50" stroke-width=".7"/><line x1="56" y1="50" x2="100" y2="50" stroke-width=".7"/>
      <line x1="50" y1="0" x2="50" y2="44" stroke-width=".7"/><line x1="50" y1="56" x2="50" y2="100" stroke-width=".7"/>
    </g>
    <circle cx="50" cy="50" r=".5" fill="#ff3b3b"/>
  </svg>
</div>

<svg id="crosshair" viewBox="-30 -30 60 60">
  <g stroke="#fff" stroke-width="1.6" opacity=".95">
    <line x1="-24" y1="0" x2="-6" y2="0"/><line x1="6" y1="0" x2="24" y2="0"/>
    <line x1="0" y1="-24" x2="0" y2="-6"/><line x1="0" y1="6" x2="0" y2="24"/>
  </g>
  <circle r="1.3" fill="#ff3b3b"/>
</svg>

<div id="lookzone"></div>
<div id="hit"></div>
<div id="flash"></div>
<div id="arrow">▲</div>

<div class="hud" id="score"></div>
<div class="hud" id="timer"></div>
<div class="hud" id="heading"></div>
<div class="hud" id="ammo"></div>
<div class="hud" id="toast"></div>

<div class="pill" id="hintBtn">方向提示：關</div>
<div class="btn" id="scopeBtn">瞄準鏡</div>
<div class="btn" id="reload">換彈</div>
<div class="btn" id="fire">射擊</div>

<div id="menu" class="overlay">
  <h1>無人機射擊訓練</h1>
  <p>請橫向握持手機，戴耳機效果最好<br>
  左半螢幕：滑動轉視角（可 360° 旋轉）<br>
  右側按鈕：<b>射擊</b>（按住連發）、<b>換彈</b>、<b>瞄準鏡</b><br>
  子彈有飛行時間與下墜，要抓提前量。沒有方向箭頭，用耳朵找無人機。</p>
  <label>視角靈敏度 <input id="sens" type="range" min="2" max="10" step="0.5" value="4.5"></label>
  <button id="startBtn">開始訓練</button>
</div>

<div id="over" class="overlay">
  <h2>訓練結束</h2>
  <div class="res" id="result"></div>
  <button id="againBtn">再玩一次</button>
</div>

<div id="rotate">請將手機橫向握持 📱</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   可調參數（想改手感就改這裡）
   ========================================================= */
const CFG = {
  roundTime: 90,        // 一局幾秒
  magSize: 30,          // 彈匣容量
  reloadTime: 2.2,      // 換彈時間（秒）
  fireRate: 7,          // 每秒發射數
  bulletSpeed: 240,     // 子彈速度（公尺/秒）
  gravity: 9.8,         // 子彈下墜
  spread: 0.002,        // 散布（弧度）
  recoil: 0.010,        // 每發後座力（弧度）
  baseFov: 75,          // 一般視野
  scopeFov: 22,         // 瞄準鏡視野
  droneCount: 3,        // 同時幾台無人機
  droneMinDist: 30,     // 無人機距離範圍（公尺）
  droneMaxDist: 90,
  droneMinSpeed: 5,     // 無人機速度範圍（公尺/秒）
  droneMaxSpeed: 14,
  hitRadius: 0.7,       // 命中半徑（公尺）
  doppler: 2.0,         // 都卜勒效果倍率（1 = 真實，越大越明顯）
  invertY: false        // 上下視角反轉
};

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* =========================================================
   Three.js 場景
   ========================================================= */
const canvas = $('game');
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const SKY = 0xa9d0f0;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 120, 420);
const camera = new THREE.PerspectiveCamera(CFG.baseFov, 1, 0.1, 600);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.7, 0);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
resize();

function buildWorld() {
  scene.add(new THREE.HemisphereLight(0xdfeeff, 0x4a5a3a, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(-60, 100, 40);
  scene.add(sun);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshLambertMaterial({ color: 0x5d7d50 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const grid = new THREE.GridHelper(1200, 120, 0x2f4a2a, 0x3c5a36);
  grid.position.y = 0.02;
  scene.add(grid);

  const box = new THREE.BoxGeometry(1, 1, 1);

  // 遠處建築（方向參考）
  for (let i = 0; i < 40; i++) {
    const w = rand(8, 22), h = rand(8, 50), d = rand(8, 22), a = rand(0, TAU), r = rand(115, 210);
    const m = new THREE.Mesh(box, new THREE.MeshLambertMaterial({
      color: new THREE.Color().setHSL(rand(0.55, 0.62), 0.08, rand(0.4, 0.65))
    }));
    m.scale.set(w, h, d);
    m.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
    m.rotation.y = rand(0, TAU);
    scene.add(m);
  }
  // 近處箱子（轉動時有視差感）
  for (let i = 0; i < 16; i++) {
    const s = rand(1, 2.2), a = rand(0, TAU), r = rand(10, 45);
    const m = new THREE.Mesh(box, new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(0.08, 0.4, rand(0.3, 0.45)) }));
    m.scale.set(s, s, s);
    m.position.set(Math.cos(a) * r, s / 2, Math.sin(a) * r);
    m.rotation.y = rand(0, TAU);
    scene.add(m);
  }
  // 東南西北標示柱：北=紅色（-z），東=+x
  const poles = [[0, -130, 0xff3030], [130, 0, 0xffffff], [0, 130, 0xffffff], [-130, 0, 0xffffff]];
  poles.forEach(function(p){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 70, 8), new THREE.MeshLambertMaterial({ color: p[2] }));
    m.position.set(p[0], 35, p[1]);
    scene.add(m);
  });
}
buildWorld();

/* =========================================================
   音效（Web Audio，HRTF 立體定位）
   ========================================================= */
let AC = null, master = null, noiseBuf = null;

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  const comp = AC.createDynamicsCompressor();
  master = AC.createGain();
  master.gain.value = 0.9;
  master.connect(comp);
  comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  // iOS：在點擊當下播一段靜音來解鎖
  const s = AC.createBufferSource();
  s.buffer = AC.createBuffer(1, 1, AC.sampleRate);
  s.connect(AC.destination);
  s.start(0);
  if (AC.state === 'suspended') AC.resume();
}

function makePanner() {
  const p = AC.createPanner();
  p.panningModel = 'HRTF';
  p.distanceModel = 'inverse';
  p.refDistance = 8;
  p.maxDistance = 500;
  p.rolloffFactor = 1.0;
  return p;
}
function setPannerPos(p, v) {
  if (p.positionX) { p.positionX.value = v.x; p.positionY.value = v.y; p.positionZ.value = v.z; }
  else p.setPosition(v.x, v.y, v.z);
}

const _fwd = new THREE.Vector3(), _up = new THREE.Vector3();
function updateListener() {
  if (!AC) return;
  const l = AC.listener;
  _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _up.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const p = camera.position;
  if (l.positionX) {
    l.positionX.value = p.x; l.positionY.value = p.y; l.positionZ.value = p.z;
    l.forwardX.value = _fwd.x; l.forwardY.value = _fwd.y; l.forwardZ.value = _fwd.z;
    l.upX.value = _up.x; l.upY.value = _up.y; l.upZ.value = _up.z;
  } else {
    l.setPosition(p.x, p.y, p.z);
    l.setOrientation(_fwd.x, _fwd.y, _fwd.z, _up.x, _up.y, _up.z);
  }
}

// 無人機螺旋槳聲：鋸齒波 + 方波 + 調幅 + 噪音
function makeDroneSound() {
  const base = rand(165, 235);
  const oscs = [];
  const mix = AC.createGain();
  mix.gain.value = 0.22;

  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 4000; lp.Q.value = 0.5;
  const vol = AC.createGain();
  vol.gain.value = 1.0;
  const panner = makePanner();
  mix.connect(lp); lp.connect(vol); vol.connect(panner); panner.connect(master);

  function addOsc(type, mult, level) {
    const o = AC.createOscillator();
    o.type = type; o.frequency.value = base * mult;
    const g = AC.createGain(); g.gain.value = level;
    o.connect(g); g.connect(mix); o.start();
    oscs.push({ node: o, f: base * mult });
  }
  addOsc('sawtooth', 1, 1);
  addOsc('sawtooth', 1.013, 0.9);
  addOsc('square', 2.02, 0.35);

  const lfo = AC.createOscillator();
  lfo.frequency.value = rand(34, 46);
  const lfoG = AC.createGain(); lfoG.gain.value = 0.09;
  lfo.connect(lfoG); lfoG.connect(mix.gain); lfo.start();

  const ns = AC.createBufferSource();
  ns.buffer = noiseBuf; ns.loop = true;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.7;
  const ng = AC.createGain(); ng.gain.value = 0.05;
  ns.connect(bp); bp.connect(ng); ng.connect(lp);
  ns.start(0, Math.random());

  return {
    oscs: oscs, panner: panner, lp: lp,
    stop: function () {
      try { oscs.forEach(function (o) { o.node.stop(); }); lfo.stop(); ns.stop(); } catch (e) {}
      try { panner.disconnect(); } catch (e) {}
    }
  };
}

const _tmp = new THREE.Vector3();
function updateDroneSound(d) {
  const s = d.snd, t = AC.currentTime;
  setPannerPos(s.panner, d.pos);
  _tmp.copy(d.pos).sub(camera.position);
  const dist = _tmp.length() || 1;
  _tmp.divideScalar(dist);
  const vAway = d.vel.dot(_tmp);                       // 遠離為正
  const k = clamp(1 - (vAway / 343) * CFG.doppler, 0.85, 1.15);
  for (let i = 0; i < s.oscs.length; i++) s.oscs[i].node.frequency.setTargetAtTime(s.oscs[i].f * k, t, 0.06);
  s.lp.frequency.setTargetAtTime(clamp(7500 / (1 + dist / 28) + 600, 700, 8000), t, 0.1);  // 越遠越悶
}

// 一次性聲音（槍聲、爆炸、換彈…）。pos 有給就是有方向的聲音
function playBurst(o) {
  if (!AC) return;
  const t = AC.currentTime;
  const dur = Math.min(o.dur || 0.3, 0.95);
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = o.freq || 2000;
  const g = AC.createGain();
  g.gain.setValueAtTime(o.gain || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g);
  if (o.pos) { const p = makePanner(); setPannerPos(p, o.pos); g.connect(p); p.connect(master); }
  else g.connect(master);
  src.start(t, Math.random() * 0.05);
  src.stop(t + dur + 0.05);
  if (o.thump) {
    const so = AC.createOscillator(), sg = AC.createGain();
    so.type = 'sine';
    so.frequency.setValueAtTime(o.thump, t);
    so.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    sg.gain.setValueAtTime(0.7, t);
    sg.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    so.connect(sg); sg.connect(master);
    so.start(t); so.stop(t + 0.2);
  }
}
function playBeep(freq, dur, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}

/* =========================================================
   遊戲狀態
   ========================================================= */
let state = 'menu';            // menu | playing | over
let yaw = 0, pitch = 0, recoilOff = 0;
let sens = 0.0045;
let scoped = false, hintOn = false;
let mag = CFG.magSize, reloading = false, reloadT = 0, fireCd = 0, firing = false;
let timeLeft = CFG.roundTime, score = 0, kills = 0, shots = 0, hits = 0, hitDistSum = 0;
let drones = [];
const respawn = [];
const bullets = [];
const particles = [];

/* =========================================================
   無人機
   ========================================================= */
const gBody = new THREE.BoxGeometry(0.5, 0.16, 0.5);
const gArm = new THREE.BoxGeometry(1.5, 0.05, 0.07);
const gRotor = new THREE.CylinderGeometry(0.25, 0.25, 0.02, 14);
const gLed = new THREE.SphereGeometry(0.06, 8, 8);
const mBody = new THREE.MeshLambertMaterial({ color: 0x2b2f36 });
const mArm = new THREE.MeshLambertMaterial({ color: 0x3a3f48 });
const mRotor = new THREE.MeshLambertMaterial({ color: 0xcfd6df, transparent: true, opacity: 0.7 });
const mLed = new THREE.MeshBasicMaterial({ color: 0xff2a2a });

function buildDroneMesh() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(gBody, mBody));
  const a1 = new THREE.Mesh(gArm, mArm); a1.rotation.y = Math.PI / 4; g.add(a1);
  const a2 = new THREE.Mesh(gArm, mArm); a2.rotation.y = -Math.PI / 4; g.add(a2);
  const d = 0.53;
  [[d, d], [d, -d], [-d, d], [-d, -d]].forEach(function (p) {
    const r = new THREE.Mesh(gRotor, mRotor);
    r.position.set(p[0], 0.07, p[1]);
    g.add(r);
  });
  const led = new THREE.Mesh(gLed, mLed);
  led.position.set(0, -0.02, 0.27);
  g.add(led);
  return g;
}

function spawnDrone() {
  const r0 = rand(CFG.droneMinDist, CFG.droneMaxDist);
  const speed = rand(CFG.droneMinSpeed, CFG.droneMaxSpeed);
  const d = {
    mesh: buildDroneMesh(),
    r0: r0, rAmp: rand(3, 12), rFreq: rand(0.2, 0.6),
    th: rand(0, TAU), w: (speed / r0) * (Math.random() < 0.5 ? -1 : 1),
    y0: rand(8, 35), yAmp: rand(1, 5), yFreq: rand(0.3, 0.9),
    phase: rand(0, TAU), t: 0,
    pos: new THREE.Vector3(), prev: new THREE.Vector3(), vel: new THREE.Vector3(),
    snd: null, dead: false
  };
  d.pos.set(Math.cos(d.th) * r0, d.y0, Math.sin(d.th) * r0);
  d.prev.copy(d.pos);
  d.mesh.position.copy(d.pos);
  scene.add(d.mesh);
  if (AC) d.snd = makeDroneSound();
  drones.push(d);
}

function updateDrone(d, dt) {
  d.t += dt;
  d.th += d.w * dt;
  d.prev.copy(d.pos);
  const r = d.r0 + d.rAmp * Math.sin(d.rFreq * d.t + d.phase);
  d.pos.set(Math.cos(d.th) * r, d.y0 + d.yAmp * Math.sin(d.yFreq * d.t), Math.sin(d.th) * r);
  if (dt > 0) d.vel.copy(d.pos).sub(d.prev).divideScalar(dt);
  d.mesh.position.copy(d.pos);
  d.mesh.rotation.y = Math.atan2(d.vel.x, d.vel.z);
  if (d.snd) updateDroneSound(d);
}

function removeDrone(d) {
  d.dead = true;
  scene.remove(d.mesh);
  if (d.snd) { d.snd.stop(); d.snd = null; }
}

/* =========================================================
   子彈、命中、爆炸
   ========================================================= */
const gTracer = new THREE.CylinderGeometry(0.03, 0.03, 2.5, 5);
gTracer.rotateX(Math.PI / 2);
const mTracer = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.85 });
for (let i = 0; i < 48; i++) {
  const m = new THREE.Mesh(gTracer, mTracer);
  m.visible = false;
  scene.add(m);
  bullets.push({ mesh: m, active: false, pos: new THREE.Vector3(), prev: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0 });
}
const gPart = new THREE.SphereGeometry(0.14, 6, 6);
const mPart = new THREE.MeshBasicMaterial({ color: 0xffa030 });
for (let i = 0; i < 60; i++) {
  const m = new THREE.Mesh(gPart, mPart);
  m.visible = false;
  scene.add(m);
  particles.push({ mesh: m, active: false, vel: new THREE.Vector3(), life: 0 });
}

function explosion(pos) {
  let n = 0;
  for (let i = 0; i < particles.length && n < 16; i++) {
    const p = particles[i];
    if (p.active) continue;
    p.active = true; p.life = rand(0.5, 0.9); n++;
    p.mesh.position.copy(pos);
    p.mesh.scale.setScalar(1);
    p.mesh.visible = true;
    p.vel.set(rand(-1, 1), rand(-0.3, 1), rand(-1, 1)).normalize().multiplyScalar(rand(5, 14));
  }
}
function stepParticles(dt) {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; p.mesh.visible = false; continue; }
    p.vel.y -= 9.8 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.scale.setScalar(Math.max(0.1, p.life * 1.4));
  }
}

const _d = new THREE.Vector3(), _c = new THREE.Vector3();
function segSphere(p0, p1, c, r) {
  _d.copy(p1).sub(p0);
  const len2 = _d.lengthSq();
  let t = 0;
  if (len2 > 0) t = clamp(_c.copy(c).sub(p0).dot(_d) / len2, 0, 1);
  _c.copy(p0).addScaledVector(_d, t);
  return _c.distanceToSquared(c) <= r * r;
}

function onHit(d) {
  const dist = d.pos.distanceTo(camera.position);
  const pts = Math.round(100 + dist);
  score += pts; kills++; hits++; hitDistSum += dist;
  toast('擊落 +' + pts + '　距離 ' + Math.round(dist) + ' m');
  explosion(d.pos);
  playBurst({ pos: d.pos, dur: 0.9, freq: 1200, gain: 2.5, thump: 90 });
  playBeep(1800, 0.06, 0.18);
  const hm = $('hit');
  hm.classList.remove('show'); void hm.offsetWidth; hm.classList.add('show');
  removeDrone(d);
  respawn.push(1.2);
}

function stepBullets(dt) {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.active) continue;
    b.prev.copy(b.pos);
    b.vel.y -= CFG.gravity * dt;
    b.pos.addScaledVector(b.vel, dt);
    b.life -= dt;
    let hit = null;
    for (let j = 0; j < drones.length; j++) {
      const d = drones[j];
      if (d.dead) continue;
      if (segSphere(b.prev, b.pos, d.pos, CFG.hitRadius)) { hit = d; break; }
    }
    if (hit) { onHit(hit); b.active = false; b.mesh.visible = false; continue; }
    if (b.pos.y < 0 || b.life <= 0) { b.active = false; b.mesh.visible = false; continue; }
    b.mesh.position.copy(b.pos);
    b.mesh.lookAt(b.pos.x + b.vel.x, b.pos.y + b.vel.y, b.pos.z + b.vel.z);
  }
}

/* =========================================================
   射擊、換彈、瞄準鏡
   ========================================================= */
const _dir = new THREE.Vector3(), _right = new THREE.Vector3(), _upv = new THREE.Vector3();
function fireOne() {
  if (reloading) return;
  if (mag <= 0) { playBurst({ dur: 0.05, freq: 3500, gain: 0.25 }); startReload(); return; }
  mag--; shots++;
  // 彈道方向 = 目前準心方向（含後座力）+ 小散布
  _dir.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _right.set(1, 0, 0).applyQuaternion(camera.quaternion);
  _upv.set(0, 1, 0).applyQuaternion(camera.quaternion);
  _dir.addScaledVector(_right, rand(-CFG.spread, CFG.spread)).addScaledVector(_upv, rand(-CFG.spread, CFG.spread)).normalize();

  let b = null;
  for (let i = 0; i < bullets.length; i++) if (!bullets[i].active) { b = bullets[i]; break; }
  if (!b) b = bullets[0];
  b.active = true; b.life = 2.2;
  b.pos.copy(camera.position).addScaledVector(_dir, 0.5);
  b.pos.y -= 0.05;
  b.prev.copy(b.pos);
  b.vel.copy(_dir).multiplyScalar(CFG.bulletSpeed);
  b.mesh.visible = true;
  b.mesh.position.copy(b.pos);

  recoilOff += CFG.recoil * (scoped ? 0.7 : 1);
  yaw += rand(-0.002, 0.002);
  playBurst({ dur: 0.35, freq: 2500, gain: 0.8, thump: 140 });
  const fl = $('flash');
  fl.classList.remove('show'); void fl.offsetWidth; fl.classList.add('show');
}

function startReload() {
  if (reloading || mag >= CFG.magSize || state !== 'playing') return;
  reloading = true;
  reloadT = CFG.reloadTime;
  setTimeout(function () { playBurst({ dur: 0.08, freq: 3000, gain: 0.35 }); }, 300);
  setTimeout(function () { playBurst({ dur: 0.08, freq: 2500, gain: 0.4 }); }, 1400);
  setTimeout(function () { playBurst({ dur: 0.06, freq: 4000, gain: 0.45 }); }, Math.max(100, CFG.reloadTime * 1000 - 150));
}

function setScope(on) {
  scoped = on;
  $('scopeOv').classList.toggle('on', on);
  $('crosshair').classList.toggle('off', on);
  $('scopeBtn').classList.toggle('on', on);
}

/* =========================================================
   輸入（Pointer Events：每根手指獨立追蹤）
   ========================================================= */
const look = { id: null, x: 0, y: 0 };
const lookzone = $('lookzone');
lookzone.addEventListener('pointerdown', function (e) {
  if (look.id !== null) return;
  look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY;
  try { lookzone.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
lookzone.addEventListener('pointermove', function (e) {
  if (e.pointerId !== look.id) return;
  const dx = e.clientX - look.x, dy = e.clientY - look.y;
  look.x = e.clientX; look.y = e.clientY;
  if (state === 'playing' || state === 'menu') {
    const s = sens * (camera.fov / CFG.baseFov);      // 瞄準鏡時靈敏度自動降低
    yaw -= dx * s;
    pitch -= dy * s * (CFG.invertY ? -1 : 1);
    pitch = clamp(pitch, -1.4, 1.4);                  // 垂直限制約 ±80°
  }
  e.preventDefault();
});
function endLook(e) { if (e.pointerId === look.id) look.id = null; }
lookzone.addEventListener('pointerup', endLook);
lookzone.addEventListener('pointercancel', endLook);
lookzone.addEventListener('lostpointercapture', endLook);

function bindButton(el, onDown, onUp) {
  el.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.classList.add('down');
    if (onDown) onDown();
  });
  const up = function () { el.classList.remove('down'); if (onUp) onUp(); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
bindButton($('fire'), function () { firing = true; }, function () { firing = false; });
bindButton($('reload'), function () { if (state === 'playing') startReload(); });
bindButton($('scopeBtn'), function () { if (state === 'playing') setScope(!scoped); });
bindButton($('hintBtn'), function () {
  hintOn = !hintOn;
  $('hintBtn').textContent = '方向提示：' + (hintOn ? '開' : '關');
});

// 防止 iOS / Android 的縮放、橡皮筋、長按選單
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) {
  if (e.target && e.target.tagName === 'INPUT') return;   // 讓靈敏度滑桿可拖動
  e.preventDefault();
}, { passive: false });

/* =========================================================
   HUD
   ========================================================= */
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1200);
}
const lastText = {};
function setText(id, str) {
  if (lastText[id] === str) return;
  lastText[id] = str;
  $(id).textContent = str;
}
const COMPASS = ['N 北', 'NE', 'E 東', 'SE', 'S 南', 'SW', 'W 西', 'NW'];
function updateHud() {
  setText('score', '分數 ' + score + '\n擊落 ' + kills);
  $('score').style.whiteSpace = 'pre';
  setText('timer', String(Math.max(0, Math.ceil(timeLeft))));
  const deg = (((-yaw * 180 / Math.PI) % 360) + 360) % 360;
  setText('heading', Math.round(deg) + '°  ' + COMPASS[Math.round(deg / 45) % 8]);
  setText('ammo', reloading ? '換彈中…' : (mag + ' / ' + CFG.magSize));
}

const _v = new THREE.Vector3(), _l = new THREE.Vector3();
function updateArrow() {
  const arrow = $('arrow');
  if (!hintOn || state !== 'playing') { arrow.style.display = 'none'; return; }
  let best = null, bd = 1e9;
  for (let i = 0; i < drones.length; i++) {
    const dd = drones[i].pos.distanceTo(camera.position);
    if (dd < bd) { bd = dd; best = drones[i]; }
  }
  if (!best) { arrow.style.display = 'none'; return; }
  camera.updateMatrixWorld();
  _l.copy(best.pos).applyMatrix4(camera.matrixWorldInverse);
  _v.copy(best.pos).project(camera);
  const onscreen = _l.z < 0 && Math.abs(_v.x) < 0.92 && Math.abs(_v.y) < 0.88;
  if (onscreen) { arrow.style.display = 'none'; return; }
  let ang = Math.atan2(_l.x, _l.y);
  if (Math.abs(_l.x) + Math.abs(_l.y) < 1e-4) ang = Math.PI / 2;
  const R = 0.36 * Math.min(window.innerWidth, window.innerHeight);
  const x = window.innerWidth / 2 + Math.sin(ang) * R;
  const y = window.innerHeight / 2 - Math.cos(ang) * R;
  arrow.style.display = 'block';
  arrow.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) rotate(' + ang + 'rad)';
}

/* =========================================================
   開始 / 結束
   ========================================================= */
function startGame() {
  drones.forEach(function (d) { removeDrone(d); });
  drones = [];
  respawn.length = 0;
  bullets.forEach(function (b) { b.active = false; b.mesh.visible = false; });
  score = 0; kills = 0; shots = 0; hits = 0; hitDistSum = 0;
  timeLeft = CFG.roundTime;
  mag = CFG.magSize; reloading = false; fireCd = 0; firing = false; recoilOff = 0;
  setScope(false);
  for (let i = 0; i < CFG.droneCount; i++) spawnDrone();
  $('menu').style.display = 'none';
  $('over').style.display = 'none';
  state = 'playing';
}

function endGame() {
  state = 'over';
  firing = false;
  setScope(false);
  drones.forEach(function (d) { removeDrone(d); });
  drones = [];
  respawn.length = 0;
  $('arrow').style.display = 'none';
  const acc = shots > 0 ? Math.round(hits / shots * 100) : 0;
  const avg = hits > 0 ? Math.round(hitDistSum / hits) : 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('droneShooterBest') || '0', 10) || 0; } catch (e) {}
  const isBest = score > best;
  if (isBest) { try { localStorage.setItem('droneShooterBest', String(score)); } catch (e) {} best = score; }
  $('result').innerHTML =
    '分數 <b>' + score + '</b>' + (isBest ? '　🏆 新紀錄' : '　最高 ' + best) + '<br>' +
    '擊落 ' + kills + ' 台　命中率 ' + acc + '%（' + hits + ' / ' + shots + '）<br>' +
    '平均擊落距離 ' + avg + ' m';
  $('over').style.display = 'flex';
}

function goFullscreen() {
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    const p = req.call(el);
    const lock = function () { try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {} };
    if (p && p.then) p.then(lock).catch(function () {}); else lock();
  } catch (e) {}
}

$('sens').addEventListener('input', function () { sens = parseFloat(this.value) * 0.001; });
$('startBtn').addEventListener('click', function () {
  sens = parseFloat($('sens').value) * 0.001;
  initAudio();
  goFullscreen();
  startGame();
});
$('againBtn').addEventListener('click', function () { initAudio(); startGame(); });

document.addEventListener('visibilitychange', function () {
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

/* =========================================================
   主迴圈
   ========================================================= */
function update(dt) {
  recoilOff *= Math.exp(-7 * dt);
  const tf = scoped ? CFG.scopeFov : CFG.baseFov;
  if (Math.abs(camera.fov - tf) > 0.05) {
    camera.fov += (tf - camera.fov) * Math.min(1, dt * 14);
    camera.updateProjectionMatrix();
  }
  if (state === 'menu') yaw += dt * 0.06;
  camera.rotation.set(clamp(pitch + recoilOff, -1.5, 1.5), yaw, 0);

  if (state === 'playing') {
    timeLeft -= dt;
    if (timeLeft <= 0) { endGame(); }
  }
  if (state === 'playing') {
    fireCd -= dt;
    if (reloading) {
      reloadT -= dt;
      if (reloadT <= 0) { reloading = false; mag = CFG.magSize; }
    }
    if (firing && fireCd <= 0) { fireOne(); fireCd = 1 / CFG.fireRate; }

    for (let i = 0; i < drones.length; i++) updateDrone(drones[i], dt);
    for (let i = respawn.length - 1; i >= 0; i--) {
      respawn[i] -= dt;
      if (respawn[i] <= 0) { respawn.splice(i, 1); spawnDrone(); }
    }
    stepBullets(dt);
    if (drones.some(function (d) { return d.dead; })) drones = drones.filter(function (d) { return !d.dead; });
  }
  stepParticles(dt);
  updateListener();
  if (state === 'playing') { updateHud(); updateArrow(); }
}

let last = performance.now();
let lastPortrait = null;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const portrait = window.innerHeight > window.innerWidth;
  if (portrait !== lastPortrait) {
    lastPortrait = portrait;
    $('rotate').style.display = portrait ? 'flex' : 'none';
  }
  if (!portrait) update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

})();
</script>
